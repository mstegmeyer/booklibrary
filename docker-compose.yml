services:
  hootshelf:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - library-data:/data
      # The e-book files, as <author>/<title>.epub. This may be a host folder
      # that is synced elsewhere, e.g. ./Books:/library.
      - library-files:/library
    # Set the public address when the library is served over HTTPS through a
    # reverse proxy. Without it, whatever address is used is accepted.
    # environment:
    #   BASE_URL: https://books.example.net
    restart: unless-stopped

volumes:
  library-data:
  library-files:
