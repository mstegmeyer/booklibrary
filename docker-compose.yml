services:
  book-library:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - library-data:/data
      # The e-book files, as <author>/<title>.epub. This may be a host folder
      # that is synced elsewhere, e.g. ./Books:/library.
      - library-files:/library
    environment:
      # The public address, when the library is served over HTTPS through a
      # reverse proxy. Leave it unset to accept whatever address is used.
      # BASE_URL: https://books.example.net
    restart: unless-stopped

volumes:
  library-data:
  library-files:
