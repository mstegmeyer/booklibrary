<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loans on iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B52}a:hover{color:#174F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; background: #FBFBF9; font-family: Inter, system-ui, sans-serif; color: #1B1E1C; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 600">Loans</h1>
<a href="AppLend.dc.html" aria-label="Lend a book" style="width: 44px; height: 44px; color: #1F6B52; display: flex; align-items: center; justify-content: flex-end">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
</a>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A615C">Lent out · 4</h2>
<ul style="list-style: none; margin: 0; padding: 0; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF">
<sc-for list="{{ lent }}" as="l" hint-placeholder-count="4">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: {{ l.line }}">
<span aria-hidden="true" style="flex: 0 0 36px; height: 54px; border-radius: 2px 4px 4px 2px; background: {{ l.bg }}; box-shadow: inset 4px 0 0 rgba(0,0,0,0.16)"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ l.title }}</span>
<span style="font-size: 13px; line-height: 18px; color: #5A615C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ l.note }}</span>
</div>
<button style="height: 44px; padding: 0 12px; border: 1px solid #8A908B; border-radius: 10px; background: #FFFFFF; color: #1B1E1C; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Returned</button>
</li>
</sc-for>
</ul>
</section>
<section style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A615C">Borrowed · 2</h2>
<button style="height: 44px; padding: 0 0 0 16px; border: 0; background: transparent; color: #1F6B52; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Add</button>
</div>
<ul style="list-style: none; margin: 0; padding: 0; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF">
<sc-for list="{{ borrowed }}" as="b" hint-placeholder-count="2">
<li style="display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: {{ b.line }}">
<span aria-hidden="true" style="flex: 0 0 36px; height: 54px; border-radius: 2px 4px 4px 2px; background: {{ b.bg }}; box-shadow: inset 4px 0 0 rgba(0,0,0,0.16)"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ b.title }}</span>
<span style="font-size: 13px; line-height: 18px; color: #5A615C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ b.note }}</span>
</div>
<button style="height: 44px; padding: 0 12px; border: 1px solid #8A908B; border-radius: 10px; background: #FFFFFF; color: #1B1E1C; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Returned</button>
</li>
</sc-for>
</ul>
</section>
<a href="#returned" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; color: #1B1E1C; font-size: 15px; font-weight: 500; text-decoration: none">
Returned loans
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A615C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
</a>
</div>
<dc-import name="TabBar" active="loans" hint-size="390px,83px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = (list) => list.map((r, i) => ({ title: r[0], note: r[1], bg: r[2], line: i === 0 ? '0' : '1px solid #E2E4DE' }));
return {
lent: rows([
['The Name of the Rose', 'Lena K. · 43 days', '#6E2F2A'],
['The Trial', 'Sophie · 55 days', '#4A4A4A'],
['The Left Hand of Darkness', 'Lena K. · 88 days', '#3F5E6B'],
['Invisible Cities', 'Tobias · 195 days', '#A0522D']
]),
borrowed: rows([
['Klara and the Sun', 'From Sophie · 17 days', '#B4532A'],
['The Overstory', 'From Tobias · 69 days', '#3D5A2A']
])
};
}
}
</script>
</body>
</html>
