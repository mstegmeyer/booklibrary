<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading on iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B52}a:hover{color:#174F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; background: #FBFBF9; font-family: Inter, system-ui, sans-serif; color: #1B1E1C; overflow: hidden">
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 600">Reading</h1>
<button aria-label="Account: Mara" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-end; cursor: pointer">
<span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 17px; background: #1B1E1C; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">M</span>
</button>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 11px; background: #ECEEE9">
<button aria-pressed="true" style="height: 44px; padding: 0; border: 0; border-radius: 8px; background: #FFFFFF; color: #1B1E1C; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Reading</button>
<button aria-pressed="false" style="height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #3C423E; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Want to read</button>
<button aria-pressed="false" style="height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #3C423E; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Finished</button>
<button aria-pressed="false" style="height: 44px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: #3C423E; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">Abandoned</button>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ current }}" as="c" hint-placeholder-count="2">
<article style="display: flex; gap: 14px; padding: 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF">
<div aria-hidden="true" style="flex: 0 0 64px; height: 96px; box-sizing: border-box; padding: 8px 6px 6px 10px; border-radius: 2px 4px 4px 2px; background: {{ c.bg }}; color: #FFFFFF; box-shadow: inset 4px 0 0 rgba(0,0,0,0.16); font-family: Literata, Georgia, serif; font-size: 11px; line-height: 13px; font-weight: 600">{{ c.title }}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<h2 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 17px; line-height: 22px; font-weight: 600">{{ c.title }}</h2>
<span style="font-size: 14px; line-height: 20px; color: #5A615C">{{ c.author }}</span>
<sc-if value="{{ c.external }}" hint-placeholder-val="{{ false }}">
<span style="align-self: flex-start; margin-top: 2px; padding: 1px 8px; border-radius: 10px; background: #E6E9E3; color: #3C423E; font-size: 12px; line-height: 18px; font-weight: 500">Not in the library</span>
</sc-if>
<div style="margin-top: 10px; height: 8px; border-radius: 4px; background: #E2E4DE"><div style="width: {{ c.pct }}; height: 8px; border-radius: 4px; background: #1F6B52"></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-size: 14px; line-height: 20px">{{ c.page }} <span style="color: #5A615C">· {{ c.pct }}</span></span>
<a href="AppProgress.dc.html" style="height: 44px; padding: 0 4px; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Update</a>
</div>
</div>
</article>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 12px; line-height: 18px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A615C">Up next</h2>
<div aria-hidden="true" style="display: flex; gap: 12px; overflow: hidden">
<sc-for list="{{ next }}" as="n" hint-placeholder-count="5">
<div style="flex: 0 0 76px; height: 114px; box-sizing: border-box; padding: 8px 6px 6px 10px; border-radius: 2px 4px 4px 2px; background: {{ n.bg }}; color: #FFFFFF; box-shadow: inset 4px 0 0 rgba(0,0,0,0.16); font-family: Literata, Georgia, serif; font-size: 11px; line-height: 14px; font-weight: 600">{{ n.title }}</div>
</sc-for>
</div>
</div>
<button style="height: 48px; border: 1px dashed #8A908B; border-radius: 12px; background: transparent; color: #1B1E1C; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
Add a book from outside the library
</button>
</div>
<dc-import name="TabBar" active="reading" hint-size="390px,83px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
current: [
{ title: 'The Name of the Rose', author: 'Umberto Eco', bg: '#6E2F2A', page: 'Page 212 of 536', pct: '40%', external: false },
{ title: 'Klara and the Sun', author: 'Kazuo Ishiguro', bg: '#B4532A', page: 'Page 221 of 307', pct: '72%', external: true }
],
next: [
{ title: 'Middlemarch', bg: '#5B3A5E' },
{ title: 'Buddenbrooks', bg: '#2F4A3E' },
{ title: 'Moby-Dick', bg: '#1F4A5C' },
{ title: 'Pride and Prejudice', bg: '#7A4458' },
{ title: 'Siddhartha', bg: '#9A6B1F' }
]
};
}
}
</script>
</body>
</html>
