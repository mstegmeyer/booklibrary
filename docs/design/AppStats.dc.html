<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Statistics on iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B52}a:hover{color:#174F3D}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding-top: 54px; display: flex; flex-direction: column; background: #FBFBF9; font-family: Inter, system-ui, sans-serif; color: #1B1E1C; overflow: hidden">
<div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<h1 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 600">Statistics</h1>
<div style="display: flex; align-items: center">
<button aria-label="Previous year" style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #1B1E1C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">2026</span>
<button aria-label="Next year" disabled style="width: 44px; height: 44px; padding: 0; border: 0; background: transparent; color: #8A908B; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 11px; background: #ECEEE9">
<button aria-pressed="true" style="height: 44px; border: 0; border-radius: 8px; background: #FFFFFF; color: #1B1E1C; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Mara</button>
<button aria-pressed="false" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: #3C423E; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Jonas</button>
<button aria-pressed="false" style="height: 44px; border: 0; border-radius: 8px; background: transparent; color: #3C423E; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Household</button>
</div>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="padding: 10px 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column">
<span style="font-size: 12px; line-height: 16px; color: #5A615C">Books finished</span>
<span style="font-family: Literata, Georgia, serif; font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums">23</span>
</div>
<div style="padding: 10px 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column">
<span style="font-size: 12px; line-height: 16px; color: #5A615C">Pages read</span>
<span style="font-family: Literata, Georgia, serif; font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums">8,412</span>
</div>
<div style="padding: 10px 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column">
<span style="font-size: 12px; line-height: 16px; color: #5A615C">Pages a day</span>
<span style="font-family: Literata, Georgia, serif; font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums">26</span>
</div>
<div style="padding: 10px 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column">
<span style="font-size: 12px; line-height: 16px; color: #5A615C">From outside the library</span>
<span style="font-family: Literata, Georgia, serif; font-size: 24px; line-height: 30px; font-weight: 600; font-variant-numeric: tabular-nums">4</span>
</div>
</div>
<section style="padding: 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600">Books finished per month</h2>
<div style="position: relative; margin-left: 22px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #E2E4DE"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 55px; height: 1px; background: #E2E4DE"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 110px; height: 1px; background: #8A908B"></div>
<span style="position: absolute; left: -22px; top: -8px; width: 16px; text-align: right; font-size: 11px; line-height: 16px; color: #5A615C">4</span>
<span style="position: absolute; left: -22px; top: 47px; width: 16px; text-align: right; font-size: 11px; line-height: 16px; color: #5A615C">2</span>
<span style="position: absolute; left: -22px; top: 102px; width: 16px; text-align: right; font-size: 11px; line-height: 16px; color: #5A615C">0</span>
<div style="position: relative; display: flex">
<sc-for list="{{ bookBars }}" as="m" hint-placeholder-count="12">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
<div style="height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px">
<sc-if value="{{ m.show }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #1B1E1C; white-space: nowrap">{{ m.label }}</span>
</sc-if>
<div style="width: 12px; height: {{ m.h }}; border-radius: 4px 4px 0 0; background: #1F6B52"></div>
</div>
<span style="margin-top: 6px; font-size: 11px; line-height: 16px; color: #5A615C">{{ m.name }}</span>
</div>
</sc-for>
</div>
</div>
</section>
<section style="padding: 14px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 14px; line-height: 20px; font-weight: 600">Pages read per month</h2>
<div style="position: relative; margin-left: 30px">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 1px; background: #E2E4DE"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 55px; height: 1px; background: #E2E4DE"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 110px; height: 1px; background: #8A908B"></div>
<span style="position: absolute; left: -32px; top: -8px; width: 26px; text-align: right; font-size: 11px; line-height: 16px; color: #5A615C">1.2k</span>
<span style="position: absolute; left: -32px; top: 47px; width: 26px; text-align: right; font-size: 11px; line-height: 16px; color: #5A615C">600</span>
<span style="position: absolute; left: -32px; top: 102px; width: 26px; text-align: right; font-size: 11px; line-height: 16px; color: #5A615C">0</span>
<div style="position: relative; display: flex">
<sc-for list="{{ pageBars }}" as="m" hint-placeholder-count="12">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center">
<div style="height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px">
<sc-if value="{{ m.show }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; color: #1B1E1C; white-space: nowrap">{{ m.label }}</span>
</sc-if>
<div style="width: 12px; height: {{ m.h }}; border-radius: 4px 4px 0 0; background: #1F6B52"></div>
</div>
<span style="margin-top: 6px; font-size: 11px; line-height: 16px; color: #5A615C">{{ m.name }}</span>
</div>
</sc-for>
</div>
</div>
</section>
</div>
<dc-import name="TabBar" active="stats" hint-size="390px,83px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const names = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
const books = [2, 1, 3, 2, 2, 1, 3, 3, 2, 2, 2, 0];
const pages = [702, 455, 1010, 688, 734, 512, 921, 1043, 870, 656, 821, 0];
return {
bookBars: books.map((v, i) => ({ name: names[i], h: Math.round(v / 4 * 110) + 'px', label: String(v), show: v === 3 })),
pageBars: pages.map((v, i) => ({ name: names[i], h: Math.round(v / 1200 * 110) + 'px', label: v.toLocaleString('en-US'), show: i === 7 }))
};
}
}
</script>
</body>
</html>
