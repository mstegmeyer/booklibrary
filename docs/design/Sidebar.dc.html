<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["library","reading","stats","loans","locations"],"default":"library"},"$preview":{"width":232,"height":450}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'library';
const s = {};
['library', 'reading', 'stats', 'loans', 'locations'].forEach((key) => {
const on = key === active;
s[key] = { bg: on ? '#DDE9E2' : 'transparent', fg: on ? '#174F3D' : '#3C423E', w: on ? 600 : 500 };
});
return { s };
}
}
