<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a book dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Literata:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B52}a:hover{color:#174F3D}
</style>
</helmet>
<div style="width: 640px; height: 680px; box-sizing: border-box; padding: 28px 32px; background: #FFFFFF; display: flex; flex-direction: column; gap: 20px; font-family: Inter, system-ui, sans-serif; color: #1B1E1C">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<h2 style="margin: 0; font-family: Literata, Georgia, serif; font-size: 24px; line-height: 30px; font-weight: 600">Add a book</h2>
<a href="Main.dc.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 8px; color: #1B1E1C; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
</a>
</div>
<div style="display: flex; gap: 24px; border-bottom: 1px solid #E2E4DE">
<button aria-pressed="true" style="height: 40px; padding: 0; border: 0; background: transparent; color: #1B1E1C; font: inherit; font-size: 14px; font-weight: 600; box-shadow: inset 0 -2px 0 #1F6B52; cursor: pointer">ISBN</button>
<button aria-pressed="false" style="height: 40px; padding: 0; border: 0; background: transparent; color: #5A615C; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Search by title</button>
<button aria-pressed="false" style="height: 40px; padding: 0; border: 0; background: transparent; color: #5A615C; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Upload e-book</button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="isbn" style="font-size: 13px; line-height: 18px; font-weight: 600">ISBN</label>
<div style="display: flex; gap: 8px">
<input id="isbn" type="text" inputmode="numeric" value="9780156001311" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A908B; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #1B1E1C; font-variant-numeric: tabular-nums">
<button style="height: 40px; padding: 0 16px; border: 1px solid #8A908B; border-radius: 8px; background: #FFFFFF; color: #1B1E1C; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Look up</button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: #5A615C">Many books to add? Scanning barcodes with the iOS app is faster.</p>
</div>
<div style="display: flex; gap: 16px; padding: 16px; border: 1px solid #E2E4DE; border-radius: 12px; background: #FBFBF9">
<div aria-hidden="true" style="flex: 0 0 64px; height: 96px; box-sizing: border-box; padding: 8px 6px 6px 10px; border-radius: 2px 4px 4px 2px; background: #6E2F2A; color: #FFFFFF; box-shadow: inset 4px 0 0 rgba(0,0,0,0.16); font-family: Literata, Georgia, serif; font-size: 11px; line-height: 13px; font-weight: 600">The Name of the Rose</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Literata, Georgia, serif; font-size: 18px; line-height: 24px; font-weight: 600">The Name of the Rose</span>
<span style="font-size: 14px; line-height: 20px">Umberto Eco</span>
<span style="font-size: 13px; line-height: 18px; color: #5A615C">1983 · 536 pages · English</span>
<span style="margin-top: auto; font-size: 13px; line-height: 18px; color: #5A615C">Found on Open Library · <a href="#other-editions">Not the right book?</a></span>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; line-height: 18px; font-weight: 600">This book is</legend>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 12px">
<label style="flex: 0 0 180px; display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px">
<input type="radio" name="ownership" checked="checked" style="width: 18px; height: 18px; margin: 0; accent-color: #1F6B52">
In our library
</label>
<select aria-label="Shelf" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8A908B; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #1B1E1C">
<option>Home › Living room › Shelf A</option>
<option>Home › Living room › Shelf B</option>
<option>Home › Study › Desk shelf</option>
<option>Home › Bedroom › Nightstand</option>
<option>Lake house › Hallway shelf</option>
</select>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<label style="flex: 0 0 180px; display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px">
<input type="radio" name="ownership" style="width: 18px; height: 18px; margin: 0; accent-color: #1F6B52">
Borrowed from
</label>
<select aria-label="Person you borrowed it from" disabled="disabled" style="flex: 1; min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9CDC7; border-radius: 8px; background: #F2F3EF; font: inherit; font-size: 14px; color: #5A615C">
<option>Choose a person</option>
<option>Lena K.</option>
<option>Sophie</option>
<option>Tobias</option>
<option>Someone new</option>
</select>
</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-size: 14px; line-height: 20px">
<input type="radio" name="ownership" style="width: 18px; height: 18px; margin: 0; accent-color: #1F6B52">
Only on my reading list
</label>
</div>
</fieldset>
<div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px">
<button style="height: 40px; padding: 0 16px; border: 1px solid #8A908B; border-radius: 8px; background: #FFFFFF; color: #1B1E1C; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Add</button>
<button style="height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #1F6B52; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Add and enter next</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":680}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
